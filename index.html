  <!-- 커버: 처음 들어오면 유리다관과 함께 인사. Pour를 누르면 다관이 기울며 걷히고, 아래 찻잔에 차가 차오릅니다.
       같은 탭에서 다시 홈으로 오면 커버 없이 바로 찻잔 화면 -->
  <section class="cover" aria-label="환영 인사">
    <img class="cover-teapot" src="assets/img/teapot.png" alt="찻잎이 우러나는 유리다관" width="1200" height="751">
    <h2 class="cover-title">차 한 잔 내려드릴게요.</h2>
    <p class="cover-sub">subin teahouse에 오신 걸 환영해요</p>
    <p class="cover-sub cover-hint">Pour를 누르면, 직접 우려낸 문장으로 차 한 잔을 내어 드릴게요</p>
    <button type="button" class="pour-btn" data-pour>Pour</button>
  </section>

  <!-- 첫 화면: 스크롤 없는 한 장면. 왼쪽 문장, 가운데 찻잔, 오른쪽 한 잔 더 -->
  <main class="hero draw" aria-live="polite">
    <div class="vessel">
      <div class="tea" aria-hidden="true"></div>
      <h1 class="line">군더더기 없이<br>투명하게,<br>가장 좋은 상태로<br>우려냅니다.</h1>
      <p class="source caption">에디터 · 카피라이터 조수빈</p>
    </div>
    <div class="cup-frame">
      <img src="assets/img/hero-cup.webp" alt="위에서 내려다본 찻잔 속 연둣빛 차">
      <div class="liquid" aria-hidden="true"></div>
      <div class="steam" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
    <button type="button" data-draw aria-label="다른 문장 우리기">Refill</button>
  </main>


  <script src="assets/ko-wrap.js"></script>
  <script src="assets/lines.js"></script>
  <script src="assets/draw.js"></script>
